[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hcu-sglang-plugin"
version = "0.3.2.dev77"
description = "SGLang HCU runtime plugin and development methods"
requires-python = ">=3.10"
dependencies = ["sglang==0.5.23"]
license = {file = "LICENSE"}

[project.entry-points."sglang.srt.plugins"]
hcu = "hcu_sglang:register"
hcu_minimax_m31 = "hcu_sglang.models.minimax_m31:register"

[project.scripts]
hcu-sglang-serve = "hcu_sglang.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["hcu_sglang*"]
exclude = ["hcu_sglang.__pycache__", "hcu_sglang.*.__pycache__"]

[tool.setuptools.package-data]
hcu_sglang = ["mem_cache/cpp_utils/*.cpp", "layers/attention/linear/csrc/*", "mem_cache/rust_tree_core/crate/**/*", "mem_cache/rust_tree_core/crate/.gitignore", "jit_overlay/**/*", "models/deepseek/current_v4/hcu_backend/csrc/*", "models/deepseek/current_v4/execution/aiter_intree_configs/**/*"]

[tool.setuptools.exclude-package-data]
hcu_sglang = ["**/__pycache__/*", "**/*.pyc"]
