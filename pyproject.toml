[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hcu-sglang-plugin"
version = "0.3.2.dev77"
description = "SGLang HCU runtime plugin and development methods"
requires-python = ">=3.10"
dependencies = ["sglang==0.5.22"]
license = {file = "LICENSE"}

[project.entry-points."sglang.srt.plugins"]
hcu = "hcu_sglang:register"

[project.entry-points."sglang.multimodal_gen.plugins"]
hcu = "hcu_sglang.multimodal_gen:register"

[project.scripts]
hcu-sglang-serve = "hcu_sglang.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["hcu_sglang*"]
exclude = ["hcu_sglang.__pycache__", "hcu_sglang.*.__pycache__"]

[tool.setuptools.package-data]
hcu_sglang = ["mem_cache/cpp_utils/*.cpp", "layers/attention/linear/csrc/*", "layers/moe/csrc/glm53_fp8_k1_indirect.cu", "layers/moe/csrc/glm53_fp8_k1_wasp.cuh", "layers/moe/csrc/glm53_fp8_prefill_ops.source.json", "layers/quantization/csrc/glm53_fp8_token_inverse.source.json", "layers/quantization/csrc/glm53_fp8_decode_skinny.source.json", "mem_cache/rust_tree_core/crate/**/*", "mem_cache/rust_tree_core/crate/.gitignore", "jit_overlay/**/*", "models/deepseek/current_v4/hcu_backend/csrc/*", "models/deepseek/current_v4/execution/aiter_intree_configs/**/*"]

[tool.setuptools.exclude-package-data]
hcu_sglang = ["**/__pycache__/*", "**/*.pyc"]

[tool.pytest.ini_options]
filterwarnings = [
    # 三方弃用噪音（0.5.22 镜像栈自带，非本仓代码；0.5.22 线不动这些依赖）：
    # 1) torch 自身 jit 内部经 compressed-tensors 配置路径触发
    "ignore:`torch.jit.script_method` is deprecated:DeprecationWarning",
    # 2) swig 绑定在 CPython 3.12 的 __module__ 告警（safetensors/compressed_tensors 侧）
    "ignore:builtin type SwigPy:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
    # 3) 镜像 pytest-asyncio 的 fixture-scope 默认值弃用
    "ignore::DeprecationWarning:pytest_asyncio.*",
]
