[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-hcu-plugin"
version = "0.1.0"
description = "HCU adaptations for SGLang model and layer modules via general plugin hooks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sglang"]

[project.entry-points."sglang.srt.plugins"]
hcu = "sglang_hcu_plugin:register"

[tool.setuptools.packages.find]
where = ["."]
include = ["sglang_hcu_plugin*"]
